name: Release on Tag

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Linux  (x86_64  &  i686)
  # ────────────────────────────────────────────────────────────────────
  linux:
    name: Linux ${{ matrix.arch_label }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch_label: x86_64
            arch_flag: 64
          - arch_label: i686
            arch_flag: 32
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib libc6-dev:i386 zip

      - name: Build all
        run: make clean all arch=${{ matrix.arch_flag }}

      - name: Package — libs-only
        run: |
          mkdir -p pkg/libs-only
          cp -r lib include pkg/libs-only/
          tar -czf cMDA_linux-${{ matrix.arch_label }}_libs-only.tar.gz -C pkg/libs-only .
          rm -rf pkg

      - name: Package — cli-only
        run: |
          mkdir -p pkg/cli-only
          cp -r bin pkg/cli-only/
          tar -czf cMDA_linux-${{ matrix.arch_label }}_cli-only.tar.gz -C pkg/cli-only .
          rm -rf pkg

      - name: Package — all
        run: |
          mkdir -p pkg/all
          cp -r lib include bin pkg/all/
          tar -czf cMDA_linux-${{ matrix.arch_label }}_all.tar.gz -C pkg/all .
          rm -rf pkg

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cMDA_linux-${{ matrix.arch_label }}_libs-only.tar.gz
            cMDA_linux-${{ matrix.arch_label }}_cli-only.tar.gz
            cMDA_linux-${{ matrix.arch_label }}_all.tar.gz

  # ────────────────────────────────────────────────────────────────────
  # macOS  (x86_64  &  arm64)
  # ────────────────────────────────────────────────────────────────────
  macos:
    name: macOS ${{ matrix.arch_label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch_label: x86_64
            runner: macos-13
          - arch_label: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all
        run: make clean all

      - name: Package — libs-only
        run: |
          mkdir -p pkg/libs-only; cp -r lib include pkg/libs-only/
          tar -czf cMDA_macos-${{ matrix.arch_label }}_libs-only.tar.gz -C pkg/libs-only .; rm -rf pkg

      - name: Package — cli-only
        run: |
          mkdir -p pkg/cli-only; cp -r bin pkg/cli-only/
          tar -czf cMDA_macos-${{ matrix.arch_label }}_cli-only.tar.gz -C pkg/cli-only .; rm -rf pkg

      - name: Package — all
        run: |
          mkdir -p pkg/all; cp -r lib include bin pkg/all/
          tar -czf cMDA_macos-${{ matrix.arch_label }}_all.tar.gz -C pkg/all .; rm -rf pkg

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cMDA_macos-${{ matrix.arch_label }}_libs-only.tar.gz
            cMDA_macos-${{ matrix.arch_label }}_cli-only.tar.gz
            cMDA_macos-${{ matrix.arch_label }}_all.tar.gz

  # ────────────────────────────────────────────────────────────────────
  # Windows  (x86_64  &  i686)  — ZIP archives
  # ────────────────────────────────────────────────────────────────────
  windows:
    name: Windows ${{ matrix.arch_label }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch_label: x86_64
            toolchain: mingw-w64-x86_64-gcc
            env_path: C:\msys64\mingw64\bin
          - arch_label: i686
            toolchain: mingw-w64-i686-gcc
            env_path: C:\msys64\mingw32\bin
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        shell: cmd
        run: |
          C:\msys64\usr\bin\bash.exe --login -c "pacman -Syu --noconfirm"
          C:\msys64\usr\bin\bash.exe --login -c "pacman -S ${{ matrix.toolchain }} zip --noconfirm"

      - name: Build
        shell: cmd
        run: |
          set PATH=${{ matrix.env_path }};%PATH%
          make clean all

      - name: Package (bash)
        shell: bash
        run: |
          make_zip(){ local tag=$1; shift; mkdir -p pkg; for d in "$@"; do cp -r "$d" pkg/; done
            cd pkg; zip -r ../cMDA_windows-${{ matrix.arch_label }}_${tag}.zip .; cd ..; rm -rf pkg; }
          make_zip libs-only lib include
          make_zip cli-only  bin
          make_zip all       lib include bin

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cMDA_windows-${{ matrix.arch_label }}_libs-only.zip
            cMDA_windows-${{ matrix.arch_label }}_cli-only.zip
            cMDA_windows-${{ matrix.arch_label }}_all.zip

  # ────────────────────────────────────────────────────────────────────
  # Embedded  (AVR / ESP32 / ESP8266 / STM32)  — libs-only .tar.gz
  # ────────────────────────────────────────────────────────────────────
  embedded:
    name: Embedded libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc gcc-arm-none-eabi build-essential

      - name: Build AVR
        run: make avr

      - name: Build STM32 (Cortex-M4)
        run: make stm32

      - name: Package embedded libs
        run: |
          for target in avr stm32; do
            mkdir -p pkg; cp lib/libcMDA_${target}.a pkg/; cp -r include pkg/
            tar -czf cMDA_${target}_libs-only.tar.gz -C pkg .; rm -rf pkg
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            cMDA_avr_libs-only.tar.gz
            cMDA_stm32_libs-only.tar.gz
